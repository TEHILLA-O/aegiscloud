name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: CDK synth
        run: npx cdk synth -c env=dev
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: eu-west-2
          AEGIS_SKIP_DOCKER: '1'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: CDK-nag / cfn-nag placeholder
        run: echo "Add cdk-nag in a follow-up if you want automated rule packs on every synth."

  deploy-dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy
        run: npx cdk deploy --all -c env=dev --require-approval never
      - name: Health verification
        run: npm run aegis -- status --env dev
